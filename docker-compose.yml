services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn_dev_only
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgres://cairn:cairn_dev_only@postgres:5432/cairn?sslmode=disable
      CAIRN_API_KEYS: ${CAIRN_API_KEYS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
