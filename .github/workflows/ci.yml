name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn_dev_only
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - run: gofmt -w . && git diff --exit-code
      - run: go build ./...
      - run: go test -race ./...
      - run: go run ./cmd/cairn-migrate
        env:
          DATABASE_URL: postgres://cairn:cairn_dev_only@localhost:5432/cairn?sslmode=disable
      - run: go test -tags=integration -race -v ./...
        env:
          DATABASE_URL: postgres://cairn:cairn_dev_only@localhost:5432/cairn?sslmode=disable
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn_dev_only@localhost:5432/cairn?sslmode=disable
