name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn_dev_only
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - run: gofmt -w . && git diff --exit-code
      - run: go test -race ./...
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: for migration in internal/database/migrations/*.sql; do PGPASSWORD=cairn_dev_only psql -h localhost -U cairn -d cairn -v ON_ERROR_STOP=1 -f "$migration"; done
      - run: go test -tags=integration -race ./...
        env:
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn_dev_only@localhost:5432/cairn?sslmode=disable
